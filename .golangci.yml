# golangci-lint v2 config — https://golangci-lint.run
# Starter set for learning: the standard linters + revive + misspell. Kept small on
# purpose — crank it up later. gofumpt runs as a formatter.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - revive # style / best-practice lints
    - misspell # catch typos in comments & strings
  exclusions:
    # Exercise stubs are intentionally incomplete while you solve them.
    paths:
      - ".*/exercises/.*"

formatters:
  enable:
    - gofumpt
